<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>文件去重</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
      }
      /* 文件夹操作栏：路径输入框与按钮横向排列 */
      .folder-bar {
        display: flex;
        gap: 8px;
        max-width: 640px;
      }
      #folderPath {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
      }
      /* 通用按钮样式 */
      .btn {
        padding: 6px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #chooseFolderBtn {
        background: #2d8cf0;
        color: #fff;
      }
      #scanBtn {
        background: #19be6b;
        color: #fff;
      }
      /* 扫描结果展示区 */
      #scanResult {
        margin-top: 12px;
        min-height: 18px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>文件去重</h1>
    <!-- 文件夹选择栏：展示已选路径，点击输入框或按钮均可弹出系统文件夹选择对话框 -->
    <div class="folder-bar">
      <input id="folderPath" type="text" placeholder="请选择文件夹" readonly />
      <button id="chooseFolderBtn" class="btn" type="button">选择文件夹</button>
      <button id="scanBtn" class="btn" type="button">扫描</button>
    </div>
    <!-- 扫描结果：展示后端程序返回的文案 -->
    <p id="scanResult"></p>
    <script src="renderer.js"></script>
  </body>
</html>
