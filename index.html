<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>文件去重</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
      }
      /* 文件夹选择栏：路径输入框与按钮横向排列 */
      .folder-bar {
        display: flex;
        gap: 8px;
        max-width: 560px;
      }
      #folderPath {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
      }
      #chooseFolderBtn {
        padding: 6px 14px;
        border: none;
        border-radius: 4px;
        background: #2d8cf0;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>文件去重</h1>
    <!-- 文件夹选择栏：展示已选路径，点击输入框或按钮均可弹出系统文件夹选择对话框 -->
    <div class="folder-bar">
      <input id="folderPath" type="text" placeholder="请选择文件夹" readonly />
      <button id="chooseFolderBtn" type="button">选择文件夹</button>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
